[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring"
version = "0.1.0"
description = "Validação de contrato, baseline e monitoramento de drift para risco de crédito do Tech Challenge FIAP"
requires-python = ">=3.13"
dependencies = [
  "evidently==0.7.23",
  "joblib==1.5.3",
  "mlflow==3.18.0",
  "pandas==2.3.0",
  "pandera[pandas]==0.30.1",
  "psutil==7.2.2",
  "scikit-learn==1.8.0",
  "xlrd==2.0.2",
]

[project.scripts]
credit-scoring = "credit_scoring.cli:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
